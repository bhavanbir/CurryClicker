<svg xmlns="http://www.w3.org/2000/svg" width="48" height="64" viewBox="0 0 48 64" shape-rendering="crispEdges">
  <!-- Customer sheet: 3 cols (idle, walk-A, walk-B) x 4 rows (palette variants).
       One set of frames is defined in <defs>; each row re-tints it via CSS
       custom properties on the wrapping <g>. All rects on integer 16px-grid
       coordinates. -->
  <style>
    .o{fill:#191c1e}
    .h{fill:var(--h,#5a3a26)}.hh{fill:var(--hh,#7a5236)}
    .s{fill:var(--s,#f2c99a)}.s2{fill:var(--s2,#d8a878)}
    .t{fill:var(--t,#4f86c6)}.t2{fill:var(--t2,#3a659c)}
    .p{fill:var(--p,#2f3a4a)}
  </style>
  <defs>
    <!-- head + torso shared by every frame -->
    <g id="body">
      <rect class="o" x="4" y="0" width="8" height="7"/>
      <rect class="o" x="3" y="7" width="10" height="5"/>
      <rect class="h" x="6" y="1" width="4" height="1"/>
      <rect class="h" x="5" y="2" width="6" height="2"/>
      <rect class="hh" x="6" y="2" width="2" height="1"/>
      <rect class="h" x="5" y="4" width="1" height="1"/>
      <rect class="h" x="10" y="4" width="1" height="1"/>
      <rect class="s" x="6" y="4" width="4" height="1"/>
      <rect class="s" x="5" y="5" width="6" height="1"/>
      <rect class="s" x="6" y="6" width="4" height="1"/>
      <rect class="o" x="6" y="5" width="1" height="1"/>
      <rect class="o" x="9" y="5" width="1" height="1"/>
      <rect class="s2" x="9" y="6" width="1" height="1"/>
      <rect class="t" x="4" y="7" width="8" height="5"/>
      <rect class="t2" x="10" y="8" width="2" height="3"/>
      <rect class="s" x="7" y="7" width="2" height="1"/>
    </g>
    <!-- frame 0: idle / seated -->
    <g id="f0">
      <use href="#body"/>
      <rect class="s" x="3" y="9" width="1" height="2"/>
      <rect class="s" x="12" y="9" width="1" height="2"/>
      <rect class="o" x="4" y="12" width="8" height="3"/>
      <rect class="p" x="5" y="12" width="2" height="3"/>
      <rect class="p" x="9" y="12" width="2" height="3"/>
      <rect class="o" x="4" y="15" width="3" height="1"/>
      <rect class="o" x="9" y="15" width="3" height="1"/>
    </g>
    <!-- frame 1: walk A (left leg forward, arms swung) -->
    <g id="f1">
      <use href="#body"/>
      <rect class="s" x="3" y="8" width="1" height="2"/>
      <rect class="s" x="12" y="10" width="1" height="2"/>
      <rect class="o" x="3" y="12" width="4" height="3"/>
      <rect class="o" x="8" y="12" width="4" height="2"/>
      <rect class="p" x="4" y="12" width="2" height="3"/>
      <rect class="p" x="9" y="12" width="2" height="2"/>
      <rect class="o" x="3" y="15" width="3" height="1"/>
      <rect class="o" x="9" y="14" width="3" height="1"/>
    </g>
    <!-- frame 2: walk B (mirror stride) -->
    <g id="f2">
      <use href="#body"/>
      <rect class="s" x="3" y="10" width="1" height="2"/>
      <rect class="s" x="12" y="8" width="1" height="2"/>
      <rect class="o" x="9" y="12" width="4" height="3"/>
      <rect class="o" x="4" y="12" width="4" height="2"/>
      <rect class="p" x="10" y="12" width="2" height="3"/>
      <rect class="p" x="5" y="12" width="2" height="2"/>
      <rect class="o" x="10" y="15" width="3" height="1"/>
      <rect class="o" x="4" y="14" width="3" height="1"/>
    </g>
  </defs>
  <!-- row 0: light skin, brown hair, denim-blue shirt -->
  <g style="--s:#f2c99a;--s2:#d8a878;--h:#5a3a26;--hh:#7a5236;--t:#4f86c6;--t2:#3a659c;--p:#2f3a4a">
    <use href="#f0" x="0" y="0"/><use href="#f1" x="16" y="0"/><use href="#f2" x="32" y="0"/>
  </g>
  <!-- row 1: medium skin, black hair, curry-orange shirt -->
  <g style="--s:#c98a56;--s2:#a86c3e;--h:#2b2320;--hh:#46392f;--t:#ff8c00;--t2:#d16c00;--p:#4a3526">
    <use href="#f0" x="0" y="16"/><use href="#f1" x="16" y="16"/><use href="#f2" x="32" y="16"/>
  </g>
  <!-- row 2: deep skin, dark hair, sage-green shirt -->
  <g style="--s:#8a5a38;--s2:#6e4429;--h:#2e2a26;--hh:#4a443c;--t:#4e9e6a;--t2:#38784f;--p:#263238">
    <use href="#f0" x="0" y="32"/><use href="#f1" x="16" y="32"/><use href="#f2" x="32" y="32"/>
  </g>
  <!-- row 3: fair skin, auburn hair, warm-red shirt -->
  <g style="--s:#f6d7b0;--s2:#ddb489;--h:#c9812e;--hh:#e0a052;--t:#e35d5b;--t2:#b84341;--p:#514059">
    <use href="#f0" x="0" y="48"/><use href="#f1" x="16" y="48"/><use href="#f2" x="32" y="48"/>
  </g>
</svg>
