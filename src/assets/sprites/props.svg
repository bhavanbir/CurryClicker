<svg xmlns="http://www.w3.org/2000/svg" width="64" height="16" viewBox="0 0 64 16" shape-rendering="crispEdges">
  <!-- Props sheet, 4x1 @16px: [0] table [1] plant [2] door [3] window.
       Ink outline #191c1e; warm wood ramp #5c3a1e / #7a4a22 / #a06a34 / #c89158. -->

  <!-- frame 0: dining table, set with a curry plate -->
  <g transform="translate(0,0)">
    <rect x="2" y="3" width="12" height="7" fill="#191c1e"/>
    <rect x="3" y="4" width="10" height="3" fill="#c89158"/>
    <rect x="3" y="7" width="10" height="1" fill="#a06a34"/>
    <rect x="3" y="8" width="10" height="1" fill="#7a4a22"/>
    <rect x="6" y="4" width="4" height="2" fill="#fdf6e3"/>
    <rect x="7" y="5" width="2" height="1" fill="#ff7a00"/>
    <rect x="3" y="10" width="2" height="3" fill="#5c3a1e"/>
    <rect x="11" y="10" width="2" height="3" fill="#5c3a1e"/>
    <rect x="3" y="13" width="2" height="1" fill="#191c1e"/>
    <rect x="11" y="13" width="2" height="1" fill="#191c1e"/>
    <rect x="2" y="14" width="12" height="1" fill="#191c1e" opacity="0.15"/>
  </g>

  <!-- frame 1: potted plant -->
  <g transform="translate(16,0)">
    <rect x="4" y="1" width="8" height="8" fill="#191c1e"/>
    <rect x="6" y="1" width="4" height="1" fill="#5d9a4a"/>
    <rect x="5" y="2" width="6" height="6" fill="#5d9a4a"/>
    <rect x="5" y="2" width="3" height="2" fill="#8fbf6a"/>
    <rect x="8" y="5" width="3" height="3" fill="#3d6f34"/>
    <rect x="4" y="9" width="8" height="1" fill="#191c1e"/>
    <rect x="5" y="9" width="6" height="1" fill="#d98a4a"/>
    <rect x="5" y="10" width="6" height="4" fill="#191c1e"/>
    <rect x="6" y="10" width="4" height="3" fill="#b5651d"/>
    <rect x="6" y="12" width="4" height="1" fill="#8a4c16"/>
    <rect x="4" y="14" width="8" height="1" fill="#191c1e" opacity="0.15"/>
  </g>

  <!-- frame 2: front door with glass pane and panel -->
  <g transform="translate(32,0)">
    <rect x="3" y="0" width="10" height="16" fill="#191c1e"/>
    <rect x="4" y="1" width="8" height="14" fill="#a06a34"/>
    <rect x="5" y="2" width="6" height="12" fill="#7a4a22"/>
    <rect x="5" y="2" width="1" height="12" fill="#966030"/>
    <rect x="6" y="3" width="4" height="1" fill="#cde9f2"/>
    <rect x="9" y="3" width="1" height="1" fill="#fdf6e3"/>
    <rect x="6" y="4" width="4" height="2" fill="#9fd3e6"/>
    <rect x="6" y="8" width="4" height="4" fill="#966030"/>
    <rect x="7" y="9" width="2" height="2" fill="#5c3a1e"/>
    <rect x="10" y="8" width="1" height="1" fill="#ffb800"/>
  </g>

  <!-- frame 3: paned window with sill -->
  <g transform="translate(48,0)">
    <rect x="2" y="2" width="12" height="11" fill="#191c1e"/>
    <rect x="3" y="3" width="10" height="9" fill="#a06a34"/>
    <rect x="3" y="3" width="10" height="1" fill="#c89158"/>
    <rect x="4" y="4" width="8" height="7" fill="#cde9f2"/>
    <rect x="4" y="8" width="8" height="3" fill="#9fd3e6"/>
    <rect x="9" y="4" width="2" height="1" fill="#fdf6e3"/>
    <rect x="10" y="5" width="1" height="1" fill="#fdf6e3"/>
    <rect x="7" y="4" width="1" height="7" fill="#191c1e"/>
    <rect x="4" y="7" width="8" height="1" fill="#191c1e"/>
    <rect x="2" y="13" width="12" height="1" fill="#191c1e"/>
    <rect x="3" y="13" width="10" height="1" fill="#c89158"/>
  </g>
</svg>
