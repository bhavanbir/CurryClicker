<svg xmlns="http://www.w3.org/2000/svg" width="64" height="16" viewBox="0 0 64 16" shape-rendering="crispEdges">
  <!-- frame 0: dining table (top-down) -->
  <g transform="translate(0,0)">
    <ellipse cx="8" cy="13.5" rx="6" ry="1.8" fill="#00000022"/>
    <rect x="3" y="4" width="10" height="9" rx="2" fill="#8a5a2b"/>
    <rect x="3" y="4" width="10" height="3" rx="2" fill="#a06a34"/>
    <circle cx="8" cy="8.5" r="2.4" fill="#f5ead2"/>
    <circle cx="8" cy="8.5" r="1.1" fill="#ff8c00"/>
  </g>
  <!-- frame 1: potted plant -->
  <g transform="translate(16,0)">
    <ellipse cx="8" cy="14.5" rx="4" ry="1.4" fill="#00000022"/>
    <rect x="5" y="10" width="6" height="5" fill="#b5651d"/>
    <rect x="5" y="10" width="6" height="1.4" fill="#cd7a2c"/>
    <circle cx="8" cy="7" r="4" fill="#3f9b46"/>
    <circle cx="6" cy="8" r="2.4" fill="#4eae55"/>
    <circle cx="10.2" cy="8" r="2.4" fill="#349a43"/>
  </g>
  <!-- frame 2: door -->
  <g transform="translate(32,0)">
    <rect x="3" y="1" width="10" height="15" fill="#5a3a1f"/>
    <rect x="4" y="2" width="8" height="14" fill="#8a5a2b"/>
    <rect x="5.5" y="3.5" width="5" height="5.5" fill="#9c6b3a"/>
    <rect x="5.5" y="10" width="5" height="4.5" fill="#9c6b3a"/>
    <circle cx="10.4" cy="9" r="0.8" fill="#ffd34e"/>
  </g>
  <!-- frame 3: window -->
  <g transform="translate(48,0)">
    <rect x="2" y="2" width="12" height="10" fill="#6b4a2f"/>
    <rect x="3" y="3" width="10" height="8" fill="#86c5e0"/>
    <rect x="3" y="3" width="10" height="4" fill="#a9d8ec"/>
    <rect x="7.5" y="3" width="1" height="8" fill="#6b4a2f"/>
    <rect x="3" y="6.5" width="10" height="1" fill="#6b4a2f"/>
  </g>
</svg>
