<svg xmlns="http://www.w3.org/2000/svg" width="32" height="16" viewBox="0 0 32 16" shape-rendering="crispEdges">
  <!-- Curry sheet, 2x1 @16px: [0] red curry in a cream bowl, chili garnish;
       [1] yellow curry + rice in a celadon bowl, cilantro garnish.
       Both steam. Ink outline #191c1e. -->

  <!-- frame 0: red curry -->
  <g transform="translate(0,0)">
    <rect x="3" y="14" width="10" height="1" fill="#191c1e" opacity="0.15"/>
    <rect x="3" y="8" width="10" height="5" fill="#191c1e"/>
    <rect x="4" y="9" width="8" height="2" fill="#f6ecd4"/>
    <rect x="4" y="10" width="8" height="1" fill="#e8b04b"/>
    <rect x="5" y="11" width="6" height="1" fill="#dcc9a2"/>
    <rect x="4" y="5" width="8" height="4" fill="#191c1e"/>
    <rect x="5" y="6" width="6" height="2" fill="#d96f1e"/>
    <rect x="5" y="6" width="3" height="1" fill="#f0913c"/>
    <rect x="5" y="8" width="6" height="1" fill="#a84e10"/>
    <rect x="8" y="5" width="2" height="1" fill="#e04434"/>
    <rect x="10" y="5" width="1" height="1" fill="#5da44e"/>
    <rect x="6" y="7" width="1" height="1" fill="#5da44e"/>
    <g fill="#ffffff" opacity="0.55">
      <rect x="7" y="3" width="1" height="2"/>
      <rect x="6" y="1" width="1" height="2"/>
      <rect x="9" y="2" width="1" height="2"/>
    </g>
  </g>

  <!-- frame 1: yellow curry + rice -->
  <g transform="translate(16,0)">
    <rect x="3" y="14" width="10" height="1" fill="#191c1e" opacity="0.15"/>
    <rect x="3" y="8" width="10" height="5" fill="#191c1e"/>
    <rect x="4" y="9" width="8" height="2" fill="#cfe0c3"/>
    <rect x="4" y="10" width="8" height="1" fill="#6d9460"/>
    <rect x="5" y="11" width="6" height="1" fill="#aac397"/>
    <rect x="4" y="5" width="8" height="4" fill="#191c1e"/>
    <rect x="5" y="6" width="4" height="2" fill="#e6b23a"/>
    <rect x="5" y="6" width="2" height="1" fill="#f2ca5e"/>
    <rect x="9" y="6" width="2" height="2" fill="#fdf6e3"/>
    <rect x="9" y="7" width="2" height="1" fill="#e3d3ac"/>
    <rect x="5" y="8" width="4" height="1" fill="#b9821c"/>
    <rect x="9" y="8" width="2" height="1" fill="#d8c69e"/>
    <rect x="6" y="5" width="1" height="1" fill="#5da44e"/>
    <rect x="9" y="5" width="1" height="1" fill="#5da44e"/>
    <g fill="#ffffff" opacity="0.55">
      <rect x="8" y="3" width="1" height="2"/>
      <rect x="9" y="1" width="1" height="2"/>
      <rect x="6" y="2" width="1" height="2"/>
    </g>
  </g>
</svg>
