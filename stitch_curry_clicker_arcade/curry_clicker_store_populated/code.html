<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Curry Clicker - Store</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "surface-container-highest": "#e0e3e6",
                        "on-tertiary-fixed": "#271900",
                        "background": "#fbf8f1", // Cream background for arcade feel
                        "tertiary-fixed": "#ffdeaa",
                        "surface-container-lowest": "#ffffff",
                        "surface-bright": "#fbf8f1",
                        "secondary-container": "#dae1e3",
                        "on-tertiary-fixed-variant": "#5f4100",
                        "on-primary": "#ffffff",
                        "secondary": "#586062",
                        "outline": "#897362",
                        "on-surface-variant": "#564334",
                        "secondary-fixed-dim": "#c1c8ca",
                        "tertiary-fixed-dim": "#fabc44",
                        "primary": "#ff8c00", // Orange
                        "surface-variant": "#e0e3e6",
                        "inverse-on-surface": "#eff1f4",
                        "on-primary-container": "#623200",
                        "surface-container": "#eceef1",
                        "on-error-container": "#93000a",
                        "surface-container-high": "#e6e8eb",
                        "outline-variant": "#ddc1ae",
                        "error-container": "#ffdad6",
                        "on-surface": "#111111", // Near black for text
                        "on-background": "#111111",
                        "on-primary-fixed-variant": "#6e3900",
                        "surface": "#ffffff",
                        "primary-fixed": "#ffdcc3",
                        "on-secondary": "#ffffff",
                        "surface-dim": "#d8dadd",
                        "on-secondary-fixed": "#161d1f",
                        "secondary-fixed": "#dde4e6",
                        "on-secondary-fixed-variant": "#41484a",
                        "on-tertiary": "#ffffff",
                        "inverse-surface": "#2d3133",
                        "tertiary-container": "#da9f28",
                        "on-tertiary-container": "#543900",
                        "inverse-primary": "#ffb77d",
                        "surface-container-low": "#f2f4f7",
                        "tertiary": "#7d5700",
                        "error": "#ba1a1a",
                        "primary-fixed-dim": "#ffb77d",
                        "on-secondary-container": "#5d6466",
                        "on-primary-fixed": "#2f1500",
                        "primary-container": "#ff8c00",
                        "on-error": "#ffffff",
                        "surface-tint": "#904d00",
                        "arcade-border": "#111111",
                        "arcade-shadow": "#111111"
                    },
                    fontFamily: {
                        "label-sm": ["Inter"],
                        "headline-lg": ["Montserrat"],
                        "body-md": ["Inter"],
                        "label-bold": ["Inter"],
                        "body-lg": ["Inter"],
                        "headline-lg-mobile": ["Montserrat"],
                        "display-score": ["Montserrat"],
                        "headline-md": ["Montserrat"]
                    }
                }
            }
        }
    </script>
<style>
        .arcade-box {
            border: 4px solid var(--tw-colors-arcade-border);
            box-shadow: 6px 6px 0px var(--tw-colors-arcade-shadow);
        }
        .arcade-btn {
            border: 4px solid var(--tw-colors-arcade-border);
            box-shadow: 4px 4px 0px var(--tw-colors-arcade-shadow);
            transition: all 0.1s ease;
        }
        .arcade-btn:active {
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0px var(--tw-colors-arcade-shadow);
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col items-center pb-20">
<!-- Header Navigation -->
<header class="w-full max-w-md p-4 flex justify-between items-center bg-white arcade-box mx-4 mt-4 mb-8">
<a class="flex items-center gap-2" href="#">
<span class="material-symbols-outlined text-3xl font-bold">arrow_back</span>
</a>
<h1 class="font-headline-lg text-2xl uppercase tracking-widest text-primary font-black stroke-black" style="-webkit-text-stroke: 1px black;">STORE</h1>
<div class="flex items-center gap-2 bg-yellow-300 px-3 py-1 border-2 border-black">
<span class="material-symbols-outlined text-orange-600">star</span>
<span class="font-display-score text-xl">125K</span>
</div>
</header>
<main class="w-full max-w-md px-4 flex flex-col gap-10">
<!-- Restaurant Skins Section -->
<section>
<h2 class="font-headline-md text-xl mb-4 uppercase border-b-4 border-black pb-1 inline-block">Restaurant Skins</h2>
<div class="flex flex-col gap-4">
<!-- Item 1 -->
<div class="bg-white p-4 arcade-box flex justify-between items-center">
<div class="flex items-center gap-4">
<div class="w-16 h-16 bg-purple-200 border-2 border-black flex items-center justify-center">
<span class="material-symbols-outlined text-3xl text-purple-600">nightlight</span>
</div>
<div>
<h3 class="font-label-bold text-lg">Neon Night</h3>
<p class="text-sm text-secondary">A glowing vibe.</p>
</div>
</div>
<button class="bg-green-400 text-black font-headline-md px-4 py-2 arcade-btn uppercase">
                        $4.99
                    </button>
</div>
<!-- Item 2 -->
<div class="bg-white p-4 arcade-box flex justify-between items-center">
<div class="flex items-center gap-4">
<div class="w-16 h-16 bg-blue-200 border-2 border-black flex items-center justify-center">
<span class="material-symbols-outlined text-3xl text-blue-600">memory</span>
</div>
<div>
<h3 class="font-label-bold text-lg">Cyberpunk Kitchen</h3>
<p class="text-sm text-secondary">High tech cooking.</p>
</div>
</div>
<button class="bg-green-400 text-black font-headline-md px-4 py-2 arcade-btn uppercase">
                        $6.99
                    </button>
</div>
</div>
</section>
<!-- Decorations Section -->
<section>
<h2 class="font-headline-md text-xl mb-4 uppercase border-b-4 border-black pb-1 inline-block">Decorations</h2>
<div class="flex flex-col gap-4">
<!-- Item 3 -->
<div class="bg-white p-4 arcade-box flex justify-between items-center">
<div class="flex items-center gap-4">
<div class="w-16 h-16 bg-yellow-200 border-2 border-black flex items-center justify-center">
<span class="material-symbols-outlined text-3xl text-yellow-600">restaurant</span>
</div>
<div>
<h3 class="font-label-bold text-lg">Golden Spatula Statue</h3>
<p class="text-sm text-secondary">+5 Score/sec</p>
</div>
</div>
<button class="bg-primary text-white font-headline-md px-4 py-2 arcade-btn flex items-center gap-1">
                        10K <span class="material-symbols-outlined text-sm">star</span>
</button>
</div>
<!-- Item 4 -->
<div class="bg-white p-4 arcade-box flex justify-between items-center">
<div class="flex items-center gap-4">
<div class="w-16 h-16 bg-red-200 border-2 border-black flex items-center justify-center">
<span class="material-symbols-outlined text-3xl text-red-600">videogame_asset</span>
</div>
<div>
<h3 class="font-label-bold text-lg">Retro Arcade Cabinet</h3>
<p class="text-sm text-secondary">+15 Score/sec</p>
</div>
</div>
<button class="bg-primary text-white font-headline-md px-4 py-2 arcade-btn flex items-center gap-1">
                        25K <span class="material-symbols-outlined text-sm">star</span>
</button>
</div>
<!-- Item 5 -->
<div class="bg-white p-4 arcade-box flex justify-between items-center">
<div class="flex items-center gap-4">
<div class="w-16 h-16 bg-pink-200 border-2 border-black flex items-center justify-center">
<span class="material-symbols-outlined text-3xl text-pink-600">pets</span>
</div>
<div>
<h3 class="font-label-bold text-lg">Lucky Neko Cat</h3>
<p class="text-sm text-secondary">+2 Score/sec</p>
</div>
</div>
<button class="bg-primary text-white font-headline-md px-4 py-2 arcade-btn flex items-center gap-1">
                        5K <span class="material-symbols-outlined text-sm">star</span>
</button>
</div>
</div>
</section>
</main>
</body></html>
