<!-- Floating Toast Example Script -->
<script>
        document.querySelectorAll('.aspect-square:not([disabled])').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const toast = document.createElement('div');
                toast.textContent = '+1 Slot';
                toast.className = 'fixed font-label-bold text-label-bold text-primary pointer-events-none z-50 transition-all duration-500 ease-out font-black text-xl drop-shadow-md';
                toast.style.left = `${e.clientX}px`;
                toast.style.top = `${e.clientY}px`;
                document.body.appendChild(toast);
                
                requestAnimationFrame(() => {
                    toast.style.transform = 'translateY(-50px) scale(1.2)';
                    toast.style.opacity = '0';
                });

                setTimeout(() => toast.remove(), 500);
            });
        });
