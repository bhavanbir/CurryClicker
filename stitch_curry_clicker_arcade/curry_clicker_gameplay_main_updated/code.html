<!DOCTYPE html><html lang="en" data-lt-installed="true"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Curry Clicker</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style data-purpose="custom-fonts">
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rubik:wght@400;600;800&display=swap');
    
    body {
      font-family: 'Rubik', sans-serif;
      background-color: #fdf6e3; /* Light, warm background */
      color: #333;
    }
    
    .font-arcade {
      font-family: 'Press Start 2P', cursive;
    }
  </style>
<script data-purpose="tailwind-config">
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'curry-orange': '#ff7a00',
            'curry-yellow': '#ffb800',
            'curry-dark': '#2c1e16',
            'arcade-light': '#fdf6e3',
          },
          boxShadow: {
            'arcade': '4px 4px 0px 0px rgba(44, 30, 22, 1)',
            'arcade-active': '2px 2px 0px 0px rgba(44, 30, 22, 1)',
          }
        }
      }
    }
  </script>
<style data-purpose="arcade-styles">
    /* Spicetone Arcade Design System utilities */
    .btn-arcade {
      background-color: white;
      border: 3px solid #2c1e16;
      border-radius: 8px;
      box-shadow: 4px 4px 0px 0px rgba(44, 30, 22, 1);
      transition: all 0.1s ease-in-out;
      font-weight: 600;
      color: #2c1e16;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    
    .btn-arcade:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0px 0px rgba(44, 30, 22, 1);
    }
    
    .btn-primary {
      background-color: #ff7a00;
      color: white;
    }

    .btn-primary:hover {
      background-color: #e66e00;
    }

    .game-panel {
      border: 4px solid #2c1e16;
      border-radius: 12px;
      background-color: white;
      box-shadow: 6px 6px 0px 0px rgba(44, 30, 22, 1);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col p-4 md:p-8">
<!-- BEGIN: TopBar -->
<header class="flex justify-between items-start mb-8 w-full max-w-5xl mx-auto">
<!-- Day Counter -->
<div class="btn-arcade px-6 py-3 bg-white text-xl md:text-2xl font-bold flex items-center justify-center">
      Day 12
    </div>
<!-- Score Display -->
<div class="flex flex-col items-center gap-1 btn-arcade px-6 py-2">
<div class="text-3xl md:text-5xl font-extrabold text-curry-orange font-arcade" style="text-shadow: rgb(44, 30, 22) 2px 2px 0px;">
        Score: 1,250
      </div>
<div class="text-sm md:text-base font-semibold text-gray-600 uppercase tracking-widest">
        High Score: 5,000
      </div>
</div>
<!-- Right Controls -->
<div class="flex gap-3">
<button class="btn-arcade px-4 py-2 text-sm md:text-base flex items-center gap-2">
<svg fill="none" height="20" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="20" xmlns="http://www.w3.org/2000/svg"><path d="M12 20v-8"></path><path d="M18 20v-4"></path><path d="M6 20v-12"></path></svg>
<span class="hidden md:inline">Leaderboard</span>
</button>
<button class="btn-arcade px-4 py-2 text-sm md:text-base flex items-center gap-2">
<svg fill="none" height="20" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="20" xmlns="http://www.w3.org/2000/svg"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path><circle cx="12" cy="12" r="3"></circle></svg>
<span class="hidden md:inline">Settings</span>
</button>
</div>
</header>
<!-- END: TopBar -->
<!-- BEGIN: MainGameplayArea -->
<main class="flex-1 flex flex-col items-center justify-center w-full max-w-4xl mx-auto gap-8">
<!-- Visual of Shop (Clickable Area) -->
<div class="game-panel w-full aspect-[21/9] overflow-hidden relative cursor-pointer group flex items-center justify-center bg-amber-100 hover:bg-amber-200 transition-colors">
<img alt="Professional Chef Kitchen" class="w-full h-full object-cover opacity-80 group-hover:scale-105 transition-transform duration-300" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDMQQfe1AlsD8kp4wtWkkN8hMKUrhiE1Q5Dk-YGLn49Ul7pQ-vPgOuYYR8Vcj1QdGO7wP7XEMfJiH1iuLMpuv0_GLG_DtCstn5BBMBIuS_GpL6UGnI--9yKZBz6ScoD98Wm1Ko2WxAwfRRtUN7lepW8_N-M5ASEGmCzLaCMPJctYVV2sFtt1KdrWYFhA2LWKjXP1U4LYA7nYSfd4nwUvfMl-jtFXSdp5bLHUYuc07dsWwV1WCvdIDVHOxDfg7tKx7guvsQBUXw2dWE">
<div class="absolute inset-0 flex items-center justify-center pointer-events-none">
<span class="font-arcade text-3xl md:text-5xl text-white opacity-0 group-hover:opacity-100 transition-opacity drop-shadow-md">+1</span>
</div>
</div>
<!-- Main Action Button -->
<button class="btn-arcade btn-primary text-3xl md:text-5xl px-16 py-6 md:px-24 md:py-8 font-arcade flex items-center gap-4">
<span class="">MIX!</span>
<svg class="animate-spin-slow" fill="none" height="40" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" viewBox="0 0 24 24" width="40" xmlns="http://www.w3.org/2000/svg"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"></path><path d="M21 3v5h-5"></path></svg>
</button>
</main>
<!-- END: MainGameplayArea -->
<!-- BEGIN: BottomNavigation -->
<footer class="mt-auto pt-12 flex justify-center w-full max-w-3xl mx-auto">
<div class="flex gap-4 md:gap-8 flex-wrap justify-center w-full"><button class="btn-arcade px-8 py-4 text-lg md:text-xl flex-1 flex flex-col items-center justify-center gap-2 hover:bg-curry-yellow transition-colors"><svg fill="none" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"></path><path d="M3 6h18"></path><path d="M16 10a4 4 0 0 1-8 0"></path></svg><span class="">Store</span></button><button class="btn-arcade px-8 py-4 text-lg md:text-xl flex-1 flex flex-col items-center justify-center gap-2 hover:bg-blue-100 transition-colors"><svg fill="none" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg><span class="">Kitchen</span></button></div>
</footer>
<!-- END: BottomNavigation -->
<style data-purpose="animations">
    @keyframes spin-slow {
      from {
        transform: rotate(0deg);
      }
      to {
        transform: rotate(360deg);
      }
    }
    .animate-spin-slow {
      animation: spin-slow 8s linear infinite;
    }
  </style>




</body></html>
